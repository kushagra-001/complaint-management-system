<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Complaint Management System · GLA University</title>
<style>
:root{--bg:#f1f5f9;--ink:#0f172a;--mut:#64748b;--pri:#4f46e5;--pri2:#4338ca;--side:#0b1220;--card:#fff;--line:#e5e9f0;--soft:#eef2ff;--sh:0 1px 3px #0f172a14,0 8px 24px #0f172a0a}
@media(prefers-color-scheme:dark){:root{--bg:#0a0f1c;--ink:#e6eaf2;--mut:#8b97ad;--pri:#818cf8;--pri2:#6366f1;--side:#060a14;--card:#111827;--line:#1f2937;--soft:#1e1b4b;--sh:0 1px 3px #0006}}
*{box-sizing:border-box}body{margin:0;font:14px/1.55 Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0 0 .7em;letter-spacing:-.015em}h2{font-size:1.05rem}h3{font-size:.9rem;margin-top:1.2rem}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--side);color:#a8b3c7;padding:1.3rem .9rem;display:flex;flex-direction:column;gap:.15rem;position:sticky;top:0;height:100vh}
.logo{display:flex;gap:.7rem;align-items:center;color:#fff;font-weight:700;padding:.2rem .5rem 1.4rem}.logo i{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#6366f1,#a855f7);display:grid;place-items:center;font-style:normal;font-size:18px}.logo small{display:block;color:#7b88a1;font-weight:500;font-size:11px}
.sec{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#5d6b85;padding:.9rem .75rem .3rem}
aside a{padding:.6rem .75rem;border-radius:10px;cursor:pointer;display:flex;gap:.7rem;align-items:center;font-weight:500;transition:.15s}aside a svg{width:18px;height:18px;flex:none}aside a em{margin-left:auto;font-style:normal}
aside a:hover{background:#151f33;color:#fff}aside a.on{background:linear-gradient(90deg,#4f46e5,#6366f1);color:#fff;box-shadow:0 6px 16px #4f46e555}
.me{margin-top:auto;display:flex;gap:.7rem;align-items:center;background:#111a2d;border-radius:12px;padding:.7rem}.me b{color:#fff;display:block;line-height:1.2}.me small{color:#7b88a1;text-transform:capitalize}.me a{margin-left:auto;padding:.4rem}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.top h1{margin:0;font-size:1.25rem}.top span{color:var(--mut);font-size:12px}
main{padding:1.6rem 2rem;max-width:1250px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.3rem;margin-bottom:1.2rem;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:1rem;margin-bottom:1.2rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.1rem;box-shadow:var(--sh);display:flex;gap:.9rem;align-items:center}.stat .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--pri);flex:none}.stat .ic svg{width:22px;height:22px}
.stat span{color:var(--mut);font-size:12px;font-weight:500}.stat b{display:block;font-size:1.7rem;line-height:1.1}
.stat.g .ic{background:#dcfce7;color:#16a34a}.stat.o .ic{background:#fef3c7;color:#d97706}.stat.r .ic{background:#fee2e2;color:#dc2626}.stat.b2 .ic{background:#dbeafe;color:#2563eb}
input,select,textarea{width:100%;padding:.65rem .8rem;margin:.3rem 0 .9rem;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;transition:.15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px #6366f133}label{font-weight:600;font-size:12px;color:var(--mut)}
button{background:var(--pri);color:#fff;border:0;padding:.62rem 1.2rem;border-radius:10px;cursor:pointer;font:600 13px inherit;box-shadow:0 4px 12px #4f46e533;transition:.15s}button:hover{background:var(--pri2);transform:translateY(-1px)}
button.s{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}button.s:hover{background:var(--bg)}button.d{background:#dc2626;box-shadow:none}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.8rem .6rem;border-bottom:1px solid var(--line)}th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em;background:var(--bg)}tr:hover td{background:var(--bg)}td:first-child{white-space:nowrap}.tw{overflow-x:auto;border-radius:12px}
.b{padding:.2rem .65rem;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--line)}.b:before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:.4rem}
.Pending{background:#fef3c7;color:#b45309}.Assigned{background:#dbeafe;color:#1d4ed8}.Accepted,.InProgress{background:#ede9fe;color:#6d28d9}.Resolved{background:#dcfce7;color:#15803d}.Normal{background:#e2e8f0;color:#475569}.High{background:#ffedd5;color:#c2410c}.Urgent{background:#fee2e2;color:#b91c1c}
.auth{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr}.hero{background:radial-gradient(circle at 20% 15%,#7c3aed55,transparent 45%),linear-gradient(145deg,#1e1b4b,#312e81 55%,#4f46e5);color:#fff;padding:4rem;display:flex;flex-direction:column;justify-content:center}
.hero h1{font-size:2.6rem;line-height:1.1;margin:1rem 0}.hero p{opacity:.8;max-width:430px}.hero .f{display:flex;gap:.9rem;margin:1.1rem 0;align-items:flex-start}.hero .f i{width:38px;height:38px;border-radius:10px;background:#ffffff22;display:grid;place-items:center;flex:none;font-style:normal}.hero .f b{display:block}.hero .f span{opacity:.75;font-size:13px}
.box{max-width:420px;margin:auto;padding:2rem 1.2rem;width:100%}.box h2{font-size:1.5rem}
.roles{display:flex;gap:.4rem;margin-bottom:1.2rem;background:var(--bg);padding:.3rem;border-radius:12px}.roles button{flex:1;background:transparent;color:var(--mut);box-shadow:none}.roles button.on{background:var(--card);color:var(--pri);box-shadow:var(--sh)}.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.4rem}.chips button{background:var(--soft);color:var(--pri);box-shadow:none;padding:.35rem .8rem;font-size:12px}
.hint{color:var(--mut);font-size:12px}a.l{color:var(--pri);cursor:pointer;font-weight:600}.err{background:#fee2e2;color:#991b1b;padding:.8rem 1rem;border-radius:10px;margin-bottom:1rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}.bar{height:10px;background:linear-gradient(90deg,#4f46e5,#a855f7);border-radius:99px;min-width:4px}.row{display:grid;grid-template-columns:130px 1fr 30px;gap:.7rem;align-items:center;margin:.55rem 0}
#modal{position:fixed;inset:0;background:#020617aa;backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:2.5rem 1rem;z-index:20}#modal>div{background:var(--card);max-width:700px;width:100%;border-radius:20px;padding:1.6rem;box-shadow:0 25px 60px #0006}
.tl{position:relative;border-left:2px solid var(--line);padding:0 0 .9rem 1.1rem;margin-left:.4rem}.tl:before{content:'';position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--pri)}
.toast{position:fixed;bottom:1.2rem;right:1.2rem;background:var(--ink);color:var(--bg);padding:.8rem 1.1rem;border-radius:12px;z-index:99;box-shadow:var(--sh)}
img.p{max-width:100%;max-height:230px;border-radius:12px;margin:.4rem 0}
@media(max-width:860px){.app,.auth{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.me,.sec,.logo{display:none}.hero{display:none}.two{grid-template-columns:1fr}main,.top{padding:1rem}}
</style></head><body><div id="app"></div><div id="modal" onclick="if(event.target==this)closeM()"><div id="mb"></div></div>
<script>
   // <p> My name is YashPal Singh<p>
const $=id=>document.getElementById(id),V=id=>$(id).value.trim(),fd=d=>d?new Date(d).toLocaleString():'';
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bd=s=>`<span class="b ${s.replace(/\s/g,'')}">${s}</span>`,opts=(a,sel)=>a.map(x=>`<option ${x==sel?'selected':''}>${E(x)}</option>`).join('');
const TABS={citizen:['New Complaint','My Complaints','Notifications','Profile'],officer:['Assigned','Notifications','Profile'],admin:['Dashboard','Complaints','Users','Departments','Categories','Reports','Notify','Notifications','Profile']};
let me,tab,role='citizen',reg=false,filt='All',q='',L=[],M={depts:[],cats:[]},unread=0,USERS=[],tk=sessionStorage.cmsT;
async function api(url,m='GET',body){let r;try{r=await fetch('/api/'+url,{method:m,headers:{'Content-Type':'application/json',...(tk?{Authorization:'Bearer '+tk}:{})},body:body?JSON.stringify(body):undefined})}catch(e){toast('Cannot reach the server. Run npm start and open http://localhost:3000');throw e}
const d=await r.json().catch(()=>({}));if(r.status==401&&tk&&!url.startsWith('auth')){logout();throw toast('Session expired. Please log in.')}if(!r.ok){toast(d.error||'Server problem (HTTP '+r.status+'). Open the app at http://localhost:3000');throw new Error(d.error)}return d}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),5000)}
function file(id,cb){const f=$(id)?.files[0];if(!f)return cb('');if(f.size>400000)return toast('File too large (max 400 KB)');const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)}
async function boot(){if(tk){try{me=await api('me');M=await api('meta');tab=TABS[me.role][0];await go(tab);return}catch{tk=null}}render()}
function done(d){tk=d.token;sessionStorage.cmsT=tk;me=d.user;boot()}
function logout(){tk=null;me=null;sessionStorage.removeItem('cmsT');render()}
async function go(t){tab=t;filt='All';q='';
 if(me.role!='admin'||['Dashboard','Complaints','Reports'].includes(t))L=await api('complaints');
 if(t=='Users'||t=='Notify')USERS=await api('users');
 if(t=='Notifications'){const n=await api('notifs?read=1');VIEW._n=n.items;unread=0}else unread=(await api('notifs')).unread;
 render()}
function render(){$('app').innerHTML=me?shell():authV();if(!me&&$('hs'))fetch('/api/health').then(r=>r.json()).then(d=>{$('hs').innerHTML=d.db?'<span style="color:#16a34a">● Server and database connected</span>':'<span style="color:#dc2626">● Server running but database NOT connected</span>'}).catch(()=>{$('hs').innerHTML='<span style="color:#dc2626">● Server not reachable. Run npm start, then open http://localhost:3000</span>'})}
const IC=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICONS={'New Complaint':'<path d="M12 5v14M5 12h14"/>','My Complaints':'<path d="M9 5h10M9 12h10M9 19h10M4 5h.01M4 12h.01M4 19h.01"/>','Assigned':'<path d="M9 11l3 3 8-8M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V5a2 2 0 012-2h9"/>','Dashboard':'<path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/>','Complaints':'<path d="M4 4h16v12H8l-4 4z"/>','Users':'<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM23 21v-2a4 4 0 00-3-3.9M16 3.1a4 4 0 010 7.8"/>','Departments':'<path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M14 9h1M9 13h1M14 13h1"/>','Categories':'<path d="M20 12l-8 8-9-9V3h8z"/>','Reports':'<path d="M18 20V10M12 20V4M6 20v-6"/>','Notify':'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>','Notifications':'<path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/>','Profile':'<path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z"/>'};
const DEMO={'Citizen':['citizen@cms.com','citizen123'],'Officer':['officer@cms.com','officer123'],'Admin':['admin@cms.com','admin123']};
function setRole(r){role=r;reg=false;render()}
function fill(k){$('le').value=DEMO[k][0];$('lw').value=DEMO[k][1]}
function authV(){const off=location.protocol=='file:';
return `<div class=auth><div class=hero><div class=logo style="padding:0"><i>📣</i><div>CMS<small>GLA University, Mathura</small></div></div><h1>Your voice,<br>resolved faster.</h1><p>One place to file complaints, follow every update and close the loop with the right department.</p>
<div class=f><i>🆔</i><div><b>Unique complaint ID</b><span>Track status any time, even without logging in</span></div></div><div class=f><i>🧭</i><div><b>Smart routing</b><span>Admins assign to department officers</span></div></div><div class=f><i>🔔</i><div><b>Live notifications</b><span>Every status change reaches the citizen</span></div></div></div>
<div class=box>${off?`<div class=err><b>Server not running.</b> Don't open this file directly. Run <code>npm start</code> in the project folder, then open <b>http://localhost:3000</b>.</div>`:''}
${reg?`<h2>Create your account</h2><p class=hint>Citizen registration</p><label>Full name</label><input id=rn><label>Email</label><input id=re type=email><label>Phone</label><input id=rp><label>Password (min 6)</label><input id=rw type=password><button onclick=register()>Create account</button> <a class=l onclick="reg=false;render()">Back to login</a>`
:`<div class=roles>${['citizen','officer','admin'].map(r=>`<button class="${r==role?'on':''}" onclick="setRole('${r}')">${r[0].toUpperCase()+r.slice(1)}</button>`).join('')}</div><h2>${role[0].toUpperCase()+role.slice(1)} login</h2><div id=hs class=hint></div><label>Email or User ID</label><input id=le placeholder="you@example.com or USR-1001"><label>Password</label><input id=lw type=password onkeydown="if(event.key=='Enter')login()"><button onclick=login() style="width:100%">Sign in</button>${role=='citizen'?`<p class=hint style="text-align:center">New citizen? <a class=l onclick="reg=true;render()">Register here</a></p>`:''}<div class=chips><button onclick="fill('${role[0].toUpperCase()+role.slice(1)}')">Use demo ${role} account</button></div>`}
<div class=card style="margin-top:1.4rem"><h2>Track a complaint</h2><input id=pt placeholder="Complaint ID, e.g. CMP-1001"><button class=s onclick=pubTrack()>Check status</button><div id=pr></div></div></div></div>`}
async function register(){try{done(await api('auth/register','POST',{name:V('rn'),email:V('re'),phone:V('rp'),password:$('rw').value}))}catch{}}
async function login(){try{done(await api('auth/login','POST',{login:V('le'),password:$('lw').value,role}))}catch{}}
async function pubTrack(){try{const c=await api('track/'+encodeURIComponent(V('pt')));$('pr').innerHTML=`<p><b>${c.id}</b> · ${E(c.title)}<br>${bd(c.status)} ${c.dept?E(c.dept):''}</p>`+c.hist.map(h=>`<div class=tl>${h.s}<br><small class=hint>${fd(h.t)}</small></div>`).join('')}catch{}}
const SEC={citizen:{'New Complaint':'Complaints','My Complaints':'Complaints',Notifications:'Account',Profile:'Account'},officer:{Assigned:'Work',Notifications:'Account',Profile:'Account'},admin:{Dashboard:'Overview',Complaints:'Manage',Users:'Manage',Departments:'Manage',Categories:'Manage',Reports:'Insights',Notify:'Insights',Notifications:'Account',Profile:'Account'}};
function shell(){const t=TABS[me.role];let last='';return `<div class=app><aside><div class=logo><i>📣</i><div>CMS<small>GLA University</small></div></div>${t.map(x=>{const h=SEC[me.role][x]!=last?`<div class=sec>${last=SEC[me.role][x]}</div>`:'';return h+`<a tabindex=0 class="${x==tab?'on':''}" onclick="go('${x}')">${IC(ICONS[x])}${x=='Notify'?'Send Notice':x}${x=='Notifications'&&unread?`<em class=b style="background:#ef4444;color:#fff">${unread}</em>`:''}</a>`}).join('')}
<div class=me><div class=av>${E(me.name[0]||'?').toUpperCase()}</div><div><b>${E(me.name)}</b><small>${me.role} · ${E(me.uid)}</small></div><a title="Log out" onclick=logout()>${IC('<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>')}</a></div></aside>
<div><div class=top><h1>${tab}</h1><span>${E(me.email)}${me.dept?' · '+E(me.dept)+' Dept':''}</span></div><main>${VIEW[tab]()}</main></div></div>`}
const flt=a=>a.filter(c=>(filt=='All'||c.status==filt)&&(c.id+c.title+c.desc+c.cat).toLowerCase().includes(q.toLowerCase()));
function list(a,who){if(!a.length)return '<p class=hint>No complaints here yet.</p>';
return `<div class=tw><table><tr><th>ID<th>Title<th>Category<th>Priority<th>Status${who?'<th>Citizen<th>Officer':''}<th>Date<th></tr>${a.map(c=>`<tr><td><b>${c.id}</b><td>${E(c.title)}<td>${E(c.cat)}<td>${bd(c.prio)}<td>${bd(c.status)}${who?`<td>${E(c.user?.name)}<td>${E(c.officer?.name||'—')}`:''}<td>${new Date(c.date).toLocaleDateString()}<td><button class=s onclick="detail('${c.id}')">Open</button></tr>`).join('')}</table></div>`}
function fb(){return `<div class=two><input placeholder="Search ID, title, category…" value="${E(q)}" oninput="q=this.value;$('lt').innerHTML=list(flt(L),${me.role!='citizen'})"><select onchange="filt=this.value;$('lt').innerHTML=list(flt(L),${me.role!='citizen'})">${opts(['All','Pending','Assigned','Accepted','In Progress','Resolved'],filt)}</select></div>`}
const cnt=(a,k)=>{const m={};a.forEach(x=>m[x[k]]=(m[x[k]]||0)+1);return m};
const bars=(keys,m,tot)=>keys.map(k=>`<div class=row><span>${E(k)}</span><div class=bar style="width:${(m[k]||0)/Math.max(1,tot)*100}%"></div><b>${m[k]||0}</b></div>`).join('');
const SI=['<path d="M4 4h16v12H8l-4 4z"/>','<path d="M12 8v4l3 2M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>','<path d="M9 11l3 3 8-8M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V5a2 2 0 012-2h9"/>','<path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/>'],SC={Total:[0,'b2'],Open:[1,'o'],Resolved:[2,'g'],Unassigned:[1,'o'],'Urgent open':[3,'r'],'In progress':[1,'b2'],'To accept':[1,'o'],'Assigned to me':[0,'b2'],'Avg rating':[2,'g']};
const st=(a,b)=>{const c=SC[a]||[0,''];return `<div class="stat ${c[1]}"><div class=ic>${IC(SI[c[0]])}</div><div><span>${a}</span><b>${b}</b></div></div>`},open=()=>L.filter(x=>x.status!='Resolved').length;
const VIEW={
'New Complaint':()=>`<div class=card><h2>Submit a complaint</h2><label>Title</label><input id=ct><div class=two><div><label>Category</label><select id=cc>${opts(M.cats)}</select></div><div><label>Priority</label><select id=cp>${opts(['Normal','High','Urgent'])}</select></div></div><label>Description</label><textarea id=cd rows=4></textarea><label>Photo / document (image, max 400 KB)</label><input id=cf type=file accept="image/*"><button onclick=submitC()>Submit complaint</button></div>`,
'My Complaints':()=>`<div class=grid>${st('Total',L.length)}${st('Open',open())}${st('Resolved',L.length-open())}</div><div class=card><h2>My complaints & history</h2>${fb()}<div id=lt>${list(flt(L))}</div></div>`,
'Assigned':()=>`<div class=grid>${st('Assigned to me',L.length)}${st('To accept',L.filter(c=>c.status=='Assigned').length)}${st('In progress',L.filter(c=>['Accepted','In Progress'].includes(c.status)).length)}${st('Resolved',L.length-open())}</div><div class=card><h2>Complaints assigned to me${me.dept?' · '+E(me.dept):''}</h2>${fb()}<div id=lt>${list(flt(L),1)}</div></div>`,
'Notifications':()=>`<div class=card><h2>Notifications</h2>${(VIEW._n||[]).map(x=>`<div class=tl>${E(x.msg)}<br><small class=hint>${fd(x.t)}</small></div>`).join('')||'<p class=hint>Nothing new.</p>'}</div>`,
'Profile':()=>`<div class=card style="max-width:520px"><h2>Profile</h2><p class=hint>User ID: <b>${E(me.uid)}</b> (you can log in with this ID or your email)</p><label>Name</label><input id=pn value="${E(me.name)}"><label>Email</label><input value="${E(me.email)}" disabled>${me.role=='citizen'?`<label>Phone</label><input id=pp value="${E(me.phone)}">`:''}${me.dept?`<p>Department: <b>${E(me.dept)}</b></p>`:''}<label>New password (optional)</label><input id=pw type=password><button onclick=saveP()>Save profile</button></div>`,
'Dashboard':()=>{const p=L.filter(x=>x.status=='Pending').length,m=cnt(L,'cat');
return `<div class=grid>${st('Total',L.length)}${st('Unassigned',p)}${st('In progress',open()-p)}${st('Resolved',L.length-open())}${st('Urgent open',L.filter(x=>x.prio=='Urgent'&&x.status!='Resolved').length)}</div><div class=two><div class=card><h2>By category</h2>${bars(M.cats,m,L.length)}</div><div class=card><h2>By status</h2>${bars(['Pending','Assigned','Accepted','In Progress','Resolved'],cnt(L,'status'),L.length)}</div></div><div class=card><h2>Latest complaints</h2>${list(L.slice(0,6),1)}</div>`},
'Complaints':()=>`<div class=card><h2>All complaints</h2>${fb()}<div id=lt>${list(flt(L),1)}</div></div>`,
'Users':()=>`<div class=card><h2>Add officer</h2><div class=two><div><input id=on placeholder=Name><input id=oe placeholder=Email></div><div><input id=op type=password placeholder="Password (6+)"><select id=od>${opts(M.depts)}</select></div></div><button onclick=addOff()>Add officer</button></div>
<div class=card><h2>Manage users</h2><div class=tw><table><tr><th>ID<th>Name<th>Email<th>Role<th></tr>${USERS.map(u=>`<tr><td>${E(u.uid)}<td>${E(u.name)}<td>${E(u.email)}<td>${u.role}${u.dept?' · '+E(u.dept):''}<td>${u.id==me.id?'':`<button class=d onclick="delU('${u.id}')">Delete</button>`}</tr>`).join('')}</table></div></div>`,
'Departments':()=>manage('depts','Department'),'Categories':()=>manage('cats','Category'),
'Reports':()=>{const r=L.filter(x=>x.rating),avg=r.length?(r.reduce((a,x)=>a+x.rating,0)/r.length).toFixed(1):'–';
return `<div class=grid>${st('Resolved',L.length-open())}${st('Open',open())}${st('Avg rating',avg)}</div><div class=card><h2>By department</h2>${bars(M.depts,cnt(L,'dept'),L.length)}<br><button onclick=csv()>Download CSV report</button></div>`},
'Notify':()=>`<div class=card><h2>Send notification</h2><label>Send to</label><select id=nt><option value=citizen>All citizens</option><option value=officer>All officers</option>${USERS.map(u=>`<option value="${u.id}">${E(u.name)} (${u.role})</option>`).join('')}</select><label>Message</label><textarea id=nm rows=3></textarea><button onclick=sendN()>Send</button></div>`};
function manage(k,l){return `<div class=card><h2>${l}s</h2><div class=two><input id=mi placeholder="New ${l.toLowerCase()} name"><div><button onclick="addM('${k}')">Add ${l.toLowerCase()}</button></div></div>${M[k].map((x,i)=>`<div class=tl>${E(x)} <button class=d style="padding:.1rem .6rem;margin-left:.5rem" onclick="delM('${k}',${i})">Remove</button></div>`).join('')}</div>`}
async function saveM(){M=await api('meta','PUT',M);render()}
function addM(k){const v=V('mi');if(v&&!M[k].includes(v)){M[k].push(v);saveM()}}
function delM(k,i){M[k].splice(i,1);saveM()}
async function addOff(){try{await api('users','POST',{name:V('on'),email:V('oe'),password:$('op').value,dept:V('od')});toast('Officer added');go('Users')}catch{}}
async function delU(id){if(confirm('Delete this user? Their open complaints return to Pending.')){await api('users/'+id,'DELETE');go('Users')}}
async function sendN(){try{const r=await api('notify','POST',{to:V('nt'),msg:V('nm')});toast('Sent to '+r.sent+' user(s)');$('nm').value=''}catch{}}
function submitC(){file('cf',async img=>{try{const r=await api('complaints','POST',{title:V('ct'),cat:V('cc'),prio:V('cp'),desc:V('cd'),img});toast('Submitted. Your ID is '+r.id);go('My Complaints')}catch{}})}
async function saveP(){try{me=await api('me','PUT',{name:V('pn'),phone:$('pp')?V('pp'):undefined,password:V('pw')||undefined});toast('Profile saved');render()}catch{}}
function closeM(){$('modal').style.display='none'}
async function detail(id){const c=await api('complaints/'+id);let act='';
if(me.role=='admin'){const os=USERS.length?USERS:await api('users');USERS=os;act=`<h3>Admin actions</h3><div class=two><div><label>Assign to officer</label><select id=ao><option value="">—</option>${os.filter(u=>u.role=='officer').map(u=>`<option value="${u.id}" ${c.officer&&u.id==c.officer._id?'selected':''}>${E(u.name)} (${E(u.dept)})</option>`).join('')}</select></div><div><label>Priority</label><select id=ap>${opts(['Normal','High','Urgent'],c.prio)}</select></div></div><button onclick="adminAct('${id}')">Save changes</button>`}
if(me.role=='officer'&&c.status!='Resolved')act=c.status=='Assigned'?`<button onclick="offAct('${id}','Accepted')">Accept complaint</button>`:`<h3>Update</h3><label>Status</label><select id=os>${opts(['In Progress','Resolved'])}</select><label>Resolution details / note</label><textarea id=orr rows=3></textarea><label>Proof (image, optional)</label><input id=of type=file accept="image/*"><button onclick="offAct('${id}')">Update status</button>`;
if(me.role=='citizen'&&c.status=='Resolved'&&!c.rating)act=`<h3>Rate the resolution</h3><select id=rt><option>5<option>4<option>3<option>2<option>1</select><input id=rf placeholder="Feedback (optional)"><button onclick="rate('${id}')">Submit feedback</button>`;
$('mb').innerHTML=`<h2>${c.id} · ${E(c.title)}</h2><p>${bd(c.status)} ${bd(c.prio)} · ${E(c.cat)}${c.dept?' · '+E(c.dept):''}</p><p>${E(c.desc)}</p>${c.img?`<img class=p src="${c.img}" alt="Attachment">`:''}<p class=hint>Filed by ${E(c.user?.name)} (${E(c.user?.uid)}) · Handled by: ${c.officer?E(c.officer.name):'not assigned yet'}</p>${c.res?`<p><b>Resolution:</b> ${E(c.res)}</p>`:''}${c.proof?`<img class=p src="${c.proof}" alt="Proof">`:''}${c.rating?`<p>Rating: ${'★'.repeat(c.rating)} ${E(c.fb)}</p>`:''}
<h3>History</h3>${c.hist.map(h=>`<div class=tl><b>${h.s}</b> · ${E(h.n)}<br><small class=hint>${fd(h.t)}</small></div>`).join('')}${act}<p><button class=s onclick=closeM()>Close</button></p>`;$('modal').style.display='flex'}
async function adminAct(id){try{await api(`complaints/${id}/assign`,'PATCH',{officer:V('ao')||undefined,prio:V('ap')});closeM();toast('Saved');go(tab)}catch{}}
function offAct(id,s){file('of',async p=>{try{await api(`complaints/${id}/status`,'PATCH',{status:s||V('os'),note:s?'':V('orr'),proof:p||undefined});closeM();toast('Updated');go(tab)}catch{}})}
async function rate(id){try{await api(`complaints/${id}/rate`,'POST',{rating:V('rt'),fb:V('rf')});closeM();toast('Thank you for your feedback');go(tab)}catch{}}
function csv(){const r=[['ID','Title','Category','Priority','Status','Dept','Officer','Date','Rating']].concat(L.map(c=>[c.id,c.title,c.cat,c.prio,c.status,c.dept||'',c.officer?.name||'',fd(c.date),c.rating||'']));
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));a.download='complaints-report.csv';a.click()}
boot();
</script></body></html>
